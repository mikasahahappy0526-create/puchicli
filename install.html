<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アライブ インストール</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
         background:#0b0b0f; color:#f5f5f5; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { width:min(420px, 92vw); background:#16161d; border:1px solid #2a2a35; border-radius:20px;
          padding:28px 22px 24px; box-shadow:0 12px 40px rgba(0,0,0,.35); text-align:center; }
  .icon { width:72px; height:72px; border-radius:16px; display:block; margin:0 auto 14px; background:#000; object-fit:cover; }
  h1 { font-size:1.25rem; margin:0 0 6px; font-weight:700; }
  .ver { opacity:.75; margin:0 0 18px; font-size:.95rem; }
  a.btn { display:block; text-decoration:none; background:linear-gradient(135deg,#7c5cff,#4f46e5);
          color:#fff; font-weight:700; padding:14px 16px; border-radius:14px; font-size:1.05rem; }
  a.btn:active { transform:scale(.98); }
  ol { text-align:left; margin:18px 0 0; padding-left:1.2rem; line-height:1.55; opacity:.9; font-size:.9rem; }
  .note { margin-top:14px; font-size:.8rem; opacity:.65; line-height:1.45; }
  code { font-size:.78rem; word-break:break-all; }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="./favicon-192.png" alt="アライブ">
    <h1>アライブ</h1>
    <p class="ver">オートクリッカー · Android APK · 0.1.92</p>
    <p class="note" style="opacity:.95;margin:0 0 12px;color:#ffb4a2">※ 0.1.92 は署名が変わったため、すでに入っているアライブは<strong>一度アンインストールしてから</strong>入れてください（アプリの設定は消えます）。</p>
    <a class="btn" id="dl" href="./alive.apk" download="alive.apk">タップしてダウンロード</a>
    <ol>
      <li>上のボタンで APK を保存</li>
      <li>通知または「ダウンロード」から開く</li>
      <li>「提供元不明のアプリ」を許可してインストール</li>
      <li>すでに入っているときは先にアンインストール（今回必須）</li>
    </ol>
    <p class="note">うまくいかないとき:<br><code>https://mikasahahappy0526-create.github.io/puchicli/alive.apk</code></p>
  </main>
</body>
</html>
